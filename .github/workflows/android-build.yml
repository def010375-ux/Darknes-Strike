name: Darknes Strike — Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - assaultcube-android-port
    paths:
      - '.github/workflows/android-build.yml'
      - 'scripts/**'
      - 'docs/**'
      - '.gitmodules'
      - 'vendor/assaultcube-android'

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and nested submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1"

      - name: Prepare AssaultCube Android project
        shell: bash
        run: |
          set -euxo pipefail
          AC_DIR="$GITHUB_WORKSPACE/vendor/assaultcube-android"
          test -f "$AC_DIR/android/app/build.gradle"
          test -d "$AC_DIR/source/SDL2"
          test -d "$AC_DIR/source/gl4es"
          test -d "$AC_DIR/source/SDL2_image"
          test -d "$AC_DIR/packages"
          test -d "$AC_DIR/config"
          # The upstream Gradle file contains the author's local Windows-only NDK path.
          sed -i '/^[[:space:]]*ndkPath[[:space:]]/d' "$AC_DIR/android/app/build.gradle"
          # Build gl4es as a static archive: Android has no libGL.so.1.
          # This prevents libmain.so from acquiring a desktop OpenGL runtime dependency.
          sed -i '/set(NO_INIT_CONSTRUCTOR ON CACHE BOOL "" FORCE)/a set(STATICLIB ON CACHE BOOL "" FORCE)' "$AC_DIR/android/app/src/main/jni/CMakeLists.txt"
          mkdir -p "$AC_DIR/android/app/src/main/assets"
          rm -rf "$AC_DIR/android/app/src/main/assets/packages" "$AC_DIR/android/app/src/main/assets/config"
          cp -a "$AC_DIR/packages" "$AC_DIR/android/app/src/main/assets/packages"
          cp -a "$AC_DIR/config" "$AC_DIR/android/app/src/main/assets/config"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"

      - name: Build native audio dependencies
        working-directory: vendor/assaultcube-android/android
        run: |
          chmod +x build_deps.sh
          # The upstream script uses plural OGG_* names, but FindOgg.cmake
          # requires the singular OGG_INCLUDE_DIR and OGG_LIBRARY variables.
          sed -i \
            -e 's/-DOGG_INCLUDE_DIRS=/-DOGG_INCLUDE_DIR=/' \
            -e 's/-DOGG_LIBRARIES=/-DOGG_LIBRARY=/' \
            build_deps.sh
          # Pin OpenAL Soft to 1.23.1: this release uses C++14 and is
          # compatible with the NDK 25 libc++ toolchain used by this port.
          sed -i 's#git clone --depth 1 https://github.com/kcat/openal-soft.git#git clone --depth 1 --branch 1.23.1 https://github.com/kcat/openal-soft.git#' build_deps.sh
          ./build_deps.sh arm64-v8a

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          # The pinned upstream submodule includes an additional wrapper JAR
          # not used by this workflow (we invoke the installed Gradle binary).
          validate-wrappers: false

      - name: Assemble ARM64 debug APK
        working-directory: vendor/assaultcube-android/android
        run: |
          gradle --no-daemon --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Darknes-Strike-Android-arm64
          path: vendor/assaultcube-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
